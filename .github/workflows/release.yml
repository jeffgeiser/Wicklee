name: Release

# Version tag pushes (v*) → versioned release, set as latest.
# Main branch pushes      → nightly pre-release (rolling, always current).
# workflow_dispatch        → nightly (manual ad-hoc build from main).
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── macOS Apple Silicon ───────────────────────────────────────────────────────
  build-macos:
    name: Build · macOS (arm64)
    # Pinned, like windows-2022 below. macos-14 was the original Apple Silicon
    # label; its arm64 image has since been withdrawn, leaving only a
    # deprecated x64 one — which is why the job failed on the *configuration*
    # rather than the label:
    #
    #   The configuration 'macos-14-arm64-us-default' is not supported
    #
    # It cancelled in one second with no steps, and because both publish jobs
    # have it in `needs:` they skipped rather than failed. So every release run
    # since 2026-10-11 built five assets, published none, and reported nothing.
    # macos-15 is the oldest label with a current arm64 image; macos-latest is
    # macos-26, which is where this pin goes next.
    runs-on: macos-15
    timeout-minutes: 30      # max observed ~10 min; cap stops runaway DuckDB compile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build:agent

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build agent
        run: cargo build --release --target aarch64-apple-darwin
        working-directory: agent

      - name: Stage binary
        run: cp agent/target/aarch64-apple-darwin/release/wicklee-agent wicklee-agent-darwin-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: wicklee-agent-darwin-aarch64
          path: wicklee-agent-darwin-aarch64

  # ── Windows x64 ───────────────────────────────────────────────────────────────
  build-windows:
    name: Build · Windows (x64)
    # Pinned: windows-latest moved to VS 18 / MSVC 14.51, which fails to compile
    # the bundled DuckDB 1.1 C++ (libduckdb-sys, cc-rs exit 2). windows-2022
    # (VS 2022 / MSVC 14.4x) is the toolchain that built v0.9.0 successfully.
    runs-on: windows-2022
    timeout-minutes: 35      # max observed ~21 min; Windows is the long pole
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build:agent

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # nvml-wrapper links against nvml.lib at compile time (runtime: nvml.dll
      # ships with NVIDIA drivers). The CUDA toolkit provides nvml.lib for CI.
      - name: Install CUDA toolkit (provides nvml.lib)
        uses: Jimver/cuda-toolkit@v0.2.15
        with:
          cuda: '12.4.0'
          method: network
          sub-packages: '["nvml_dev"]'

      - name: Build agent
        run: cargo build --release --target x86_64-pc-windows-msvc
        working-directory: agent

      - name: Stage binary
        shell: bash
        run: cp agent/target/x86_64-pc-windows-msvc/release/wicklee-agent.exe wicklee-agent-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: wicklee-agent-windows-x86_64.exe
          path: wicklee-agent-windows-x86_64.exe

  # ── Linux x64 (glibc 2.31) ────────────────────────────────────────────────────
  # v0.8.3: build inside Ubuntu 20.04 container to target glibc 2.31. The
  # v0.8.2 build ran on ubuntu-22.04 directly → glibc 2.35, which doesn't
  # run on Ubuntu 20.04 / Debian 11 / RHEL 8 (still very common on homelab
  # and BMC hardware). glibc 2.31 is forward-compatible with everything
  # Ubuntu 20.04+, Debian 11+, RHEL 8+, Fedora 33+. Covers ~99% of real
  # Linux installs. CentOS 7 holdouts must build from source.
  #
  # Why container instead of cross: simpler. The frontend builds in the
  # same container so we don't need to ferry dist/ between host and
  # container filesystems. DuckDB compiles fine — Ubuntu 20.04 has a
  # recent-enough cmake + gcc-9.
  build-linux-x64:
    name: Build · Linux (x64, glibc 2.31)
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 30      # bounded to prevent runaway builds
    steps:
      - name: Install build prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential cmake pkg-config \
            libssl-dev git
          # Node 20 from NodeSource (ubuntu:20.04 ships Node 10)
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - uses: actions/checkout@v4

      - name: Build frontend
        run: npm ci && npm run build:agent

      - uses: dtolnay/rust-toolchain@stable

      # One Linux binary per arch serves NVIDIA and non-NVIDIA hosts alike.
      # `nvml-wrapper` is target-gated in Cargo.toml (linux/windows, non-musl),
      # so it is compiled in regardless, and it dlopen-s libnvidia-ml at
      # runtime — present with the NVIDIA drivers, absent and gracefully
      # skipped without them. No NVML headers are needed to build it, which
      # this job demonstrated by compiling those crates without a CUDA repo
      # while a parallel -nvidia job installed cuda-nvml-dev for no reason.
      - name: Build agent (glibc 2.31)
        run: cargo build --release
        working-directory: agent

      - name: Stage binary
        run: cp agent/target/release/wicklee-agent wicklee-agent-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: wicklee-agent-linux-x86_64
          path: wicklee-agent-linux-x86_64

  # ── Linux arm64 (glibc 2.31) ──────────────────────────────────────────────────
  build-linux-arm64:
    name: Build · Linux (arm64, glibc 2.31)
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    timeout-minutes: 30
    steps:
      - name: Install build prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential cmake pkg-config \
            libssl-dev git
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - uses: actions/checkout@v4

      - name: Build frontend
        run: npm ci && npm run build:agent

      - uses: dtolnay/rust-toolchain@stable

      - name: Build agent (glibc 2.31)
        run: cargo build --release
        working-directory: agent

      - name: Stage binary
        run: cp agent/target/release/wicklee-agent wicklee-agent-linux-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: wicklee-agent-linux-aarch64
          path: wicklee-agent-linux-aarch64

  # ── Publish versioned release (v* tags only) ──────────────────────────────────
  # Creates a named GitHub release (e.g. v0.4.8), attaches all five binaries,
  # and marks it as the latest release. Never runs on branch pushes.
  release-versioned:
    name: Publish Release · ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux-x64, build-linux-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10      # same hardening as release-nightly — see comment there
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Agents verify auto-update downloads against this file and refuse to
      # install a release without it (agent/src/main.rs check_and_apply_update).
      - name: Generate SHA256SUMS
        run: sha256sum wicklee-agent-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          body: |
            **Install:**
            ```powershell
            # Windows
            irm https://wicklee.dev/install.ps1 | iex
            ```
            ```bash
            # macOS / Linux
            curl -fsSL https://wicklee.dev/install.sh | bash
            ```
          files: |
            wicklee-agent-darwin-aarch64
            wicklee-agent-windows-x86_64.exe
            wicklee-agent-linux-x86_64
            wicklee-agent-linux-aarch64
            SHA256SUMS

  # ── Publish nightly release (main branch + tags + manual dispatch) ────────────
  # Updates the rolling nightly pre-release. Runs on both main pushes AND version
  # tags so that `curl | bash` always gets the latest release, even when the main
  # branch build fails but the tag build succeeds.
  release-nightly:
    name: Publish Nightly Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux-x64, build-linux-arm64]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # Normal duration is ~9 seconds (download artifacts + upload to a release).
    # When GitHub's Releases API or cache service flakes, action-gh-release@v2
    # retries silently for hours instead of failing. Cap at 10 minutes so
    # a wedged publish auto-fails and you can re-run rather than waiting on
    # an indefinite hang. Run 25738180873 (2026-05-12) was a real instance:
    # all 6 builds succeeded in 20 min, then publish wedged for an hour
    # before the runner gave up with "lost communication with server."
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Agents verify auto-update downloads against this file and refuse to
      # install a release without it (agent/src/main.rs check_and_apply_update).
      - name: Generate SHA256SUMS
        run: sha256sum wicklee-agent-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            Auto-built from `main` · commit ${{ github.sha }}

            **Install (always gets this build):**
            ```powershell
            # Windows
            irm https://wicklee.dev/install.ps1 | iex
            ```
            ```bash
            # macOS / Linux
            curl -fsSL https://wicklee.dev/install.sh | bash
            ```
          files: |
            wicklee-agent-darwin-aarch64
            wicklee-agent-windows-x86_64.exe
            wicklee-agent-linux-x86_64
            wicklee-agent-linux-aarch64
            SHA256SUMS
